<footer>
  <div class="container-md beautiful-jekyll-footer">
    <div class="row">
      <div class="col-xl-8 offset-xl-2 col-lg-10 offset-lg-1">
      {% include home/profile-social.html label="Footer links" %}
      {% if page.footer-extra %}
        <div class="footer-custom-content">
          {% for file in page.footer-extra %}
            {% include {{ file }} %}
          {% endfor %}
        </div>
      {% endif %}
      <p class="theme-by text-muted">&copy; {{ site.time | date: '%Y' }} {{ site.author | escape }}</p>
      </div>
    </div>
  </div>
</footer>
