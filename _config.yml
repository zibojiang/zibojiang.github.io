# 网站身份、导航和链接
title: Zibo Jiang
author: Zibo Jiang
url: "https://zibojiang.github.io"
baseurl: ""
language: en
navbar-links:
  About Me: "/#about"
  News: "/#news"
  Projects: "/#projects"
  Honors: "/#honors"
  Blogs: "/blogs/"
round-avatar: true

# 页脚链接；首页图标的 CV / LinkedIn / Scholar 在 _data/profile-links.yml
social-network-links:
  email: "zibojiang@ucsd.edu"
  google-scholar: ""
  github: zibojiang
  rss: true
rss-description: Follow by recent activities.
share-links-active:
excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true
edit_page_button: true
keywords: "zibojiang,zibo,jiang,homepage,scholar,ee,electrical and computer engineering,ucsd,ecnu"

# 浅色主题；深色模式和导航覆盖样式在 assets/css/home-about.css
navbar-col: "#faf9f7"
navbar-text-col: "#3d3929"
navbar-border-col: "rgba(194, 113, 79, 0.2)"
page-col: "#faf9f7"
text-col: "#404040"
link-col: "#008AFF"
hover-col: "#99CCCC"
footer-col: "#faf9f7"
footer-text-col: "#777777"
footer-link-col: "#404040"
footer-hover-col: "#0085A1"
mobile-theme-col: "#0085A1"

# Jekyll 构建与现有文章网址：不要随意修改 permalink
date_format: "%B %-d, %Y"
timezone: America/Los_Angeles
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 20
kramdown:
  input: GFM
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      social-share: true
  - scope:
      path: ""
    values:
      layout: page

# 草稿/说明/开发文件不进入公开网站；公开仓库里源码仍可被看到
exclude:
  - Gemfile
  - Gemfile.lock
  - beautiful-jekyll-theme.gemspec
  - LICENSE
  - README.md
  - docs/
  - drafts/
  - .pages.yml
  - .vscode/
  - .agents/
  - .codex/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
site-css:
  - "/assets/css/home-about.css"
site-js:
  - "/assets/js/theme-toggle.js"

# 当前没有配置评论服务。将来如需 Giscus，在此添加 giscus 设置；
# 只有 page.comments 为 true 且 repository、hostname 已配置时才加载。
