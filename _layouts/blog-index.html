---
layout: blog-base
---
<h1 class="journal-visually-hidden">{{ page.title | escape }}</h1>
{{ content }}
{% if site.posts.size > 0 %}
<ol class="journal-directory" role="list">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%m.%d.%y' }}</time> – {{ post.title | escape }}</a>
  </li>
  {% endfor %}
</ol>
{% else %}
<p class="journal-empty">No posts yet. Check back soon.</p>
{% endif %}
